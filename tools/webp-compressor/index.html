<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebP Compressor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f4f5f7; --panel:#fff; --text:#202124; --muted:#687078;
      --border:#d7dbe0; --primary:#2271b1; --primary-hover:#135e96;
      --success:#198754; --danger:#b42318; --flash:#dff4e7;
    }
    @media (prefers-color-scheme: dark){
      :root{--bg:#17191c;--panel:#22252a;--text:#f2f3f5;--muted:#adb3ba;--border:#41464d;--primary:#72aee6;--primary-hover:#9ec5e8;--success:#58c98d;--danger:#ff8a80;--flash:#264a35}
    }
    *{box-sizing:border-box}
    body{margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:920px;margin:0 auto}
    h1{margin:0 0 8px;font-size:28px}
    .intro{margin:0 0 18px;color:var(--muted);line-height:1.5}
    .panel{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
    .dropzone{display:flex;align-items:center;justify-content:center;min-height:220px;padding:28px;border:2px dashed var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:.2s ease}
    .dropzone.drag{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
    .dropzone strong{display:block;margin-bottom:6px;font-size:18px}
    .dropzone span{color:var(--muted)}
    #fileInput{display:none}
    .settings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:13px;color:var(--muted);font-weight:600}
    .field input,.field select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);font:inherit}
    .field small{color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
    button{appearance:none;border:1px solid var(--border);border-radius:7px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer;background:var(--panel);color:var(--text)}
    button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    button.primary:hover{background:var(--primary-hover)}
    button:disabled{opacity:.5;cursor:default}
    .status{flex:1 1 280px;color:var(--muted)}
    .status.success{color:var(--success)} .status.error{color:var(--danger)}
    .list{display:grid;gap:10px;margin-top:16px}
    .item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}
    .thumb{width:72px;height:54px;object-fit:cover;border-radius:6px;background:#ddd}
    .meta{min-width:0}
    .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sub{margin-top:3px;color:var(--muted);font-size:13px}
    .saving{color:var(--success);font-weight:600}
    .item-actions{display:flex;gap:8px}
    .summary{display:none;flex-wrap:wrap;gap:8px;margin-top:14px}.summary.visible{display:flex}
    .chip{padding:6px 9px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--muted);font-size:13px}
    .footer{margin-top:14px;color:var(--muted);font-size:13px}
    canvas{display:none}
    @media(max-width:760px){.settings{grid-template-columns:1fr 1fr}.item{grid-template-columns:60px minmax(0,1fr)}.item-actions{grid-column:1/-1}.thumb{width:60px;height:45px}}
    @media(max-width:480px){body{padding:14px}.settings{grid-template-columns:1fr}.dropzone{min-height:180px}.actions button{width:100%}}
  
    /* MRC Tools navigation */
    .mrc-tools-nav {
      max-width: 920px;
      margin: 0 auto 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .mrc-tools-brand {
      flex: 0 0 auto;
      margin-right: 4px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .mrc-tools-nav a {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .mrc-tools-nav a:hover {
      border-color: var(--primary);
    }

    .mrc-tools-nav a[aria-current="page"] {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    @media (max-width: 640px) {
      .mrc-tools-nav {
        margin-bottom: 14px;
      }
    }

  
    /* Shared MRC Tools page width */
    .app,
    .mrc-tools-nav {
      width: 100%;
      max-width: 920px;
      margin-left: auto;
      margin-right: auto;
    }

  
    .app,
    .mrc-tools-nav {
      width: 100%;
      max-width: 920px !important;
      margin-left: auto;
      margin-right: auto;
    }

  
    .preset-bar {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      margin: 18px 0 14px;
    }

    .preset-button {
      flex: 1 1 0;
      min-width: 0;
      padding-left: 6px;
      padding-right: 6px;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .preset-bar {
        overflow-x: auto;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }

      .preset-button {
        flex: 0 0 auto;
        min-width: 82px;
      }
    }

    .preset-button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .preset-button.active:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

  
    .field-checkbox {
      display: flex;
      align-items: end;
    }

    .field-checkbox label {
      min-height: 44px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 2px;
      cursor: pointer;
    }

    .field-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .field.is-disabled {
      opacity: .45;
    }

  </style>
</head>
<body>
  <nav class="mrc-tools-nav" aria-label="MRC Tools">
    <span class="mrc-tools-brand">MRC Tools</span>
    <a href="../clean-wp-clipboard/">HTML Editor</a>
    <a href="../webp-compressor/" aria-current="page">WebP Compressor</a>
    <a href="../pdf-compressor/">PDF Compressor</a>
  </nav>

<main class="app">
  <h1>WebP Compressor</h1>
  <p class="intro">Convert JPG, PNG and other images to WebP, resize and compress them directly in your browser. Supports single or multiple files.</p>

  <section class="panel">
    <label class="dropzone" id="dropzone" for="fileInput">
      <div>
        <strong>Drop images here</strong>
        <span>or click to select one or more files</span>
      </div>
    </label>
    <input id="fileInput" type="file" accept="image/*" multiple>

    <div class="preset-bar" role="group" aria-label="Resize presets">
      <button type="button" class="preset-button" data-preset="full">Full</button>
      <button type="button" class="preset-button active" data-preset="2200">2200 px</button>
      <button type="button" class="preset-button" data-preset="1920">1920 px</button>
      <button type="button" class="preset-button" data-preset="1600">1600 px</button>
      <button type="button" class="preset-button" data-preset="1200">1200 px</button>
      <button type="button" class="preset-button" data-preset="800">800 px</button>
      <button type="button" class="preset-button" data-preset="600">600 px</button>
      <button type="button" class="preset-button" data-preset="400">400 px</button>
      <button type="button" class="preset-button" data-preset="250">250 px</button>
    </div>

    <div class="settings">
      <div class="field">
        <label for="maxWidth">Target width (px)</label>
        <input id="maxWidth" type="number" min="1" step="1" value="2200">
      </div>

      <div class="field">
        <label for="maxHeight">Target height (px)</label>
        <input id="maxHeight" type="number" min="1" step="1" value="2200">
      </div>

      <div class="field">
        <label for="quality">WebP quality</label>
        <input id="quality" type="number" min="1" max="100" step="1" value="82">
      </div>

      <div class="field">
        <label for="resizeMode">Resize mode</label>
        <select id="resizeMode">
          <option value="contain" selected>Contain</option>
          <option value="cover">Cover</option>
          <option value="stretch">Stretch</option>
          <option value="none">No resize</option>
        </select>
      </div>

      <div class="field" id="cropPositionField">
        <label for="cropPosition">Crop position</label>
        <select id="cropPosition">
          <option value="center" selected>Center</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="top-left">Top left</option>
          <option value="top-right">Top right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="bottom-right">Bottom right</option>
        </select>
      </div>

      <div class="field field-checkbox">
        <label>
          <input id="allowUpscale" type="checkbox">
          Allow upscaling
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="processButton" class="primary" type="button" disabled>Convert to WebP</button>
      <button id="downloadAllButton" type="button" disabled>Download all</button>
      <button id="clearButton" type="button" disabled>Clear</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>

    <div id="summary" class="summary"></div>
    <div id="list" class="list"></div>
  </section>

  <p class="footer">Everything happens locally in your browser: images are never uploaded to external servers.</p>
</main>

<canvas id="canvas"></canvas>

<script>
(() => {
  'use strict';

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const maxWidth = document.getElementById('maxWidth');
  const maxHeight = document.getElementById('maxHeight');
  const quality = document.getElementById('quality');
  const resizeMode = document.getElementById('resizeMode');
  const cropPosition = document.getElementById('cropPosition');
  const cropPositionField = document.getElementById('cropPositionField');
  const allowUpscale = document.getElementById('allowUpscale');
  const presetButtons = [...document.querySelectorAll('.preset-button')];
  const processButton = document.getElementById('processButton');
  const downloadAllButton = document.getElementById('downloadAllButton');
  const clearButton = document.getElementById('clearButton');
  const status = document.getElementById('status');
  const summary = document.getElementById('summary');
  const list = document.getElementById('list');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: true });

  let files = [];
  let results = [];

  const humanBytes = bytes => {
    if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
    const units = ['B','KB','MB','GB'];
    const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
  };

  function setStatus(message, type = '') {
    status.textContent = message;
    status.className = 'status' + (type ? ' ' + type : '');
  }

  function updateModeUI() {
    const mode = resizeMode.value;
    const noResize = mode === 'none';

    maxWidth.disabled = noResize;
    maxHeight.disabled = noResize;

    cropPosition.disabled = mode !== 'cover';
    cropPositionField.classList.toggle('is-disabled', mode !== 'cover');
  }

  function setPreset(value) {
    presetButtons.forEach(button => {
      button.classList.toggle('active', button.dataset.preset === String(value));
    });

    if (value === 'full') {
      resizeMode.value = 'none';
      updateModeUI();
      return;
    }

    const size = Number(value);
    resizeMode.value = 'contain';
    maxWidth.value = size;
    maxHeight.value = size;
    updateModeUI();
  }

  function clearPresetSelection() {
    presetButtons.forEach(button => button.classList.remove('active'));
    updateModeUI();
  }

  function updateButtons() {
    processButton.disabled = files.length === 0;
    clearButton.disabled = files.length === 0 && results.length === 0;
    downloadAllButton.disabled = results.length === 0;
  }

  function revokeResults() {
    for (const result of results) {
      if (result.url) URL.revokeObjectURL(result.url);
    }
    results = [];
  }

  function addFiles(incoming) {
    const accepted = [...incoming].filter(file => file.type.startsWith('image/'));
    if (!accepted.length) {
      setStatus('No valid image selected.', 'error');
      return;
    }

    revokeResults();
    files = accepted;
    renderSourceList();
    updateButtons();
    setStatus(`${files.length} ${files.length === 1 ? 'image selected' : 'images selected'}.`);
  }

  function renderSourceList() {
    list.innerHTML = '';
    summary.classList.remove('visible');
    summary.innerHTML = '';

    files.forEach(file => {
      const row = document.createElement('div');
      row.className = 'item';
      const src = URL.createObjectURL(file);
      row.innerHTML = `
        <img class="thumb" src="${src}" alt="">
        <div class="meta">
          <div class="name"></div>
          <div class="sub">${humanBytes(file.size)} · in attesa</div>
        </div>
        <div class="item-actions"></div>
      `;
      row.querySelector('.name').textContent = file.name;
      row.querySelector('.thumb').addEventListener('load', () => URL.revokeObjectURL(src), { once:true });
      list.appendChild(row);
    });
  }

  async function decodeImage(file) {
    if ('createImageBitmap' in window) {
      try {
        return await createImageBitmap(file, { imageOrientation: 'from-image' });
      } catch (_) {}
    }

    return await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Immagine non leggibile')); };
      img.src = url;
    });
  }

  function targetSize(width, height) {
    const mode = resizeMode.value;
    if (mode === 'none') {
      return {
        width,
        height,
        drawWidth: width,
        drawHeight: height,
        offsetX: 0,
        offsetY: 0
      };
    }

    const tw = Math.max(1, parseInt(maxWidth.value || width, 10));
    const th = Math.max(1, parseInt(maxHeight.value || height, 10));
    const canUpscale = allowUpscale.checked;

    if (mode === 'stretch') {
      if (!canUpscale && (tw > width || th > height)) {
        const scale = Math.min(1, tw / width, th / height);
        return {
          width: Math.max(1, Math.round(width * scale)),
          height: Math.max(1, Math.round(height * scale)),
          drawWidth: Math.max(1, Math.round(width * scale)),
          drawHeight: Math.max(1, Math.round(height * scale)),
          offsetX: 0,
          offsetY: 0
        };
      }

      return {
        width: tw,
        height: th,
        drawWidth: tw,
        drawHeight: th,
        offsetX: 0,
        offsetY: 0
      };
    }

    if (mode === 'contain') {
      let scale = Math.min(tw / width, th / height);
      if (!canUpscale) scale = Math.min(1, scale);

      const outW = Math.max(1, Math.round(width * scale));
      const outH = Math.max(1, Math.round(height * scale));

      return {
        width: outW,
        height: outH,
        drawWidth: outW,
        drawHeight: outH,
        offsetX: 0,
        offsetY: 0
      };
    }

    // cover
    let scale = Math.max(tw / width, th / height);
    if (!canUpscale) scale = Math.min(1, scale);

    const drawW = Math.max(1, Math.round(width * scale));
    const drawH = Math.max(1, Math.round(height * scale));

    // If upscaling is disabled and the source is smaller than the requested canvas,
    // shrink the output canvas to what the source can actually fill without enlargement.
    const outW = canUpscale ? tw : Math.min(tw, drawW);
    const outH = canUpscale ? th : Math.min(th, drawH);

    const pos = cropPosition.value;
    let offsetX = Math.round((outW - drawW) / 2);
    let offsetY = Math.round((outH - drawH) / 2);

    if (pos.includes('left')) offsetX = 0;
    if (pos.includes('right')) offsetX = outW - drawW;
    if (pos === 'left') offsetX = 0;
    if (pos === 'right') offsetX = outW - drawW;

    if (pos.includes('top')) offsetY = 0;
    if (pos.includes('bottom')) offsetY = outH - drawH;
    if (pos === 'top') offsetY = 0;
    if (pos === 'bottom') offsetY = outH - drawH;

    return {
      width: Math.max(1, outW),
      height: Math.max(1, outH),
      drawWidth: drawW,
      drawHeight: drawH,
      offsetX,
      offsetY
    };
  }

  function canvasToWebPBlob(q) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('WebP is not supported by this browser'));
        resolve(blob);
      }, 'image/webp', q);
    });
  }

  function slugifyName(value) {
    return value
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .replace(/-{2,}/g, '-');
  }

  function outputName(name) {
    const base = name.replace(/\.[^.]+$/, '') || 'image';
    const slug = slugifyName(base) || 'image';
    return `${slug}.webp`;
  }

  async function convertFile(file) {
    const image = await decodeImage(file);
    const width = image.width || image.naturalWidth;
    const height = image.height || image.naturalHeight;
    const target = targetSize(width, height);

    canvas.width = target.width;
    canvas.height = target.height;
    ctx.clearRect(0, 0, target.width, target.height);
    ctx.drawImage(
      image,
      target.offsetX,
      target.offsetY,
      target.drawWidth,
      target.drawHeight
    );

    if (image.close) image.close();

    const q = Math.min(1, Math.max(0.01, Number(quality.value || 82) / 100));
    const blob = await canvasToWebPBlob(q);
    const url = URL.createObjectURL(blob);

    return {
      source: file,
      blob,
      url,
      name: outputName(file.name),
      width: target.width,
      height: target.height,
      originalWidth: width,
      originalHeight: height
    };
  }

  async function processAll() {
    if (!files.length) return;

    revokeResults();
    list.innerHTML = '';
    summary.innerHTML = '';
    summary.classList.remove('visible');
    processButton.disabled = true;
    downloadAllButton.disabled = true;
    setStatus('Converting…');

    let originalTotal = 0;
    let outputTotal = 0;
    let failed = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      originalTotal += file.size;

      try {
        const result = await convertFile(file);
        results.push(result);
        outputTotal += result.blob.size;
        renderResult(result);
        setStatus(`Converted ${i + 1} of ${files.length} images…`);
      } catch (error) {
        console.error(error);
        failed += 1;
        renderError(file, error.message || 'Error');
      }
    }

    renderSummary(originalTotal, outputTotal, failed);
    updateButtons();
    setStatus(
      failed ? `Conversion completed with ${failed} error(s).` : 'Conversion completed.',
      failed ? 'error' : 'success'
    );
  }

  function renderResult(result) {
    const saving = result.source.size > 0 ? Math.round((1 - result.blob.size / result.source.size) * 100) : 0;
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <img class="thumb" src="${result.url}" alt="">
      <div class="meta">
        <div class="name"></div>
        <div class="sub">
          ${result.width}×${result.height}px · ${humanBytes(result.source.size)} → ${humanBytes(result.blob.size)}
          <span class="saving">${saving >= 0 ? ` · −${saving}%` : ` · +${Math.abs(saving)}%`}</span>
        </div>
      </div>
      <div class="item-actions">
        <button type="button" class="download-one">Download</button>
      </div>
    `;
    row.querySelector('.name').textContent = result.name;
    row.querySelector('.download-one').addEventListener('click', () => downloadResult(result));
    list.appendChild(row);
  }

  function renderError(file, message) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<div></div><div class="meta"><div class="name"></div><div class="sub" style="color:var(--danger)"></div></div><div></div>`;
    row.querySelector('.name').textContent = file.name;
    row.querySelector('.sub').textContent = message;
    list.appendChild(row);
  }

  function renderSummary(original, output, failed) {
    const saving = original > 0 ? Math.round((1 - output / original) * 100) : 0;
    summary.innerHTML = `
      <span class="chip">${results.length} converted</span>
      <span class="chip">${humanBytes(original)} → ${humanBytes(output)}</span>
      <span class="chip">Savings ${saving}%</span>
      ${failed ? `<span class="chip">${failed} errors</span>` : ''}
    `;
    summary.classList.add('visible');
  }

  function downloadResult(result) {
    const a = document.createElement('a');
    a.href = result.url;
    a.download = result.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function downloadAll() {
    for (let i = 0; i < results.length; i++) {
      downloadResult(results[i]);
      await new Promise(resolve => setTimeout(resolve, 180));
    }
    setStatus('Download started. Your browser may ask you to allow multiple downloads.', 'success');
  }

  function clearAll() {
    revokeResults();
    files = [];
    fileInput.value = '';
    list.innerHTML = '';
    summary.innerHTML = '';
    summary.classList.remove('visible');
    setStatus('');
    updateButtons();
  }

  presetButtons.forEach(button => {
    button.addEventListener('click', () => setPreset(button.dataset.preset));
  });

  [maxWidth, maxHeight, resizeMode, cropPosition, allowUpscale].forEach(control => {
    control.addEventListener('change', clearPresetSelection);
    control.addEventListener('input', clearPresetSelection);
  });

  resizeMode.addEventListener('change', updateModeUI);

  fileInput.addEventListener('change', () => addFiles(fileInput.files));
  processButton.addEventListener('click', processAll);
  downloadAllButton.addEventListener('click', downloadAll);
  clearButton.addEventListener('click', clearAll);

  setPreset('2200');
  updateModeUI();

  ['dragenter','dragover'].forEach(type => dropzone.addEventListener(type, e => {
    e.preventDefault();
    dropzone.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(type => dropzone.addEventListener(type, e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
  }));
  dropzone.addEventListener('drop', e => addFiles(e.dataTransfer.files));

  updateButtons();
})();
</script>
</body>
</html>
