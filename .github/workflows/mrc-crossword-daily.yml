name: MRC crossword — daily and time machine
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'YYYY-MM-DD (blank = today, Europe/Rome). Past dates require archived feeds.'
        required: false
        type: string
      publish:
        description: 'Publish TODAY on GitHub + Dropbox (false = preview only).'
        type: boolean
        default: false
      min_news:
        description: 'Minimum candidate words from news (preview can use 2)'
        type: choice
        options: ['2','4','6','8','12']
        default: '4'
  schedule:
    # Both possible UTC offsets for 06:15 Europe/Rome; gate below runs only one.
    - cron: '15 4,5 * * *'
permissions:
  contents: write
concurrency:
  group: mrc-crosswords-only
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve date and preview/publish scope
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.issue_date }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_MIN: ${{ inputs.min_news }}
        shell: bash
        run: |
          NOW="$(TZ=Europe/Rome date +%F)"
          if [ "$EVENT_NAME" = 'schedule' ] && [ "$(TZ=Europe/Rome date +%H)" != '06' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE="${INPUT_DATE:-$NOW}"
          python3 -c 'import datetime,sys; datetime.date.fromisoformat(sys.argv[1])' "$DATE"
          PUBLISH=false
          if [ "$EVENT_NAME" = 'schedule' ] || [ "$INPUT_PUBLISH" = 'true' ]; then PUBLISH=true; fi
          if [ "$PUBLISH" = true ] && [ "$DATE" != "$NOW" ]; then
            echo 'Publishing a historical issue over today is forbidden' >&2
            exit 2
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "min_news=${INPUT_MIN:-4}" >> "$GITHUB_OUTPUT"
      - name: Collect RSS and generate an isolated preview
        if: steps.params.outputs.run == 'true'
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/mrc-crossword/preview
          python3 scripts/collect_crossword_news.py --root . --date '${{ steps.params.outputs.date }}' --out /tmp/mrc-crossword/news.csv
          python3 scripts/build_daily_news_crossword.py --root . --input /tmp/mrc-crossword/news.csv --date '${{ steps.params.outputs.date }}' --min-news '${{ steps.params.outputs.min_news }}' --min-placed-news 2 --output-dir /tmp/mrc-crossword/preview
          python3 -m json.tool '/tmp/mrc-crossword/preview/preview-${{ steps.params.outputs.date }}.json' > /dev/null
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Show safe failure (do not change the last valid crossword)
        if: steps.params.outputs.run == 'true' && steps.generate.outcome == 'failure'
        run: echo 'Not enough dated news or no valid grid; last published crossword is untouched.'
      - name: Upload preview as downloadable Actions artifact
        if: steps.params.outputs.run == 'true' && steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: crossword-preview-${{ steps.params.outputs.date }}
          path: /tmp/mrc-crossword/preview/*.json
          retention-days: 14
      - name: Copy validated CURRENT issue into publishing folder
        if: steps.params.outputs.publish == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          cp '/tmp/mrc-crossword/preview/preview-${{ steps.params.outputs.date }}.json' assets/games/crosswords/mrc-del-giorno.json
          python3 - <<'PY'
          import json,pathlib
          path=pathlib.Path('assets/games/crosswords/index.json')
          data=json.loads(path.read_text(encoding='utf8'))
          date='${{ steps.params.outputs.date }}'
          data['games']=[e for e in data['games'] if e.get('id')!='daily']
          data['games'].insert(0,{'id':'daily','file':'mrc-del-giorno.json','title':'Cruciverba del giorno · notizie','language':'it','type':'daily-news','date':date})
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          PY
          python3 scripts/publish_daily_crosswords.py --date '${{ steps.params.outputs.date }}'
          python3 scripts/verify_crosswords.py assets/games/crosswords
      - name: Commit ONLY daily puzzle JSON files
        if: steps.params.outputs.publish == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'mrc-crossword-bot'
          git config user.email 'mrc-crossword-bot@users.noreply.github.com'
          git add -- assets/games/crosswords/mrc-del-giorno.json assets/games/crosswords/index.json 'assets/games/crosswords/daily/${{ steps.params.outputs.date }}.json'
          while IFS= read -r name; do
            case "$name" in
              assets/games/crosswords/mrc-del-giorno.json|assets/games/crosswords/index.json|assets/games/crosswords/daily/*.json) ;;
              *) echo "Unauthorized path: $name" >&2; exit 2 ;;
            esac
          done < <(git diff --cached --name-only)
          if ! git diff --cached --quiet; then
            git commit -m 'MRC daily crossword ${{ steps.params.outputs.date }}'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Mirror published crossword to Dropbox
        if: steps.params.outputs.publish == 'true' && steps.generate.outcome == 'success'
        env:
          MRC_DROPBOX_PROJECT_PATH: ${{ vars.MRC_DROPBOX_PROJECT_PATH }}
          DROPBOX_APP_KEY: ${{ secrets.MRC_DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.MRC_DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.MRC_DROPBOX_REFRESH_TOKEN }}
        run: python3 scripts/publish_daily_crosswords.py --date '${{ steps.params.outputs.date }}' --upload-dropbox
