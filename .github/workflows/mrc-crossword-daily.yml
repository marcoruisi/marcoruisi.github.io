name: MRC crossword — preview only
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'YYYY-MM-DD (blank = today, Europe/Rome)'
        required: false
        type: string
      category:
        description: 'Daily news or Time machine / On this day'
        type: choice
        options: ['news', 'history']
        default: 'news'
  schedule:
    - cron: '15 4,5 * * *'
permissions:
  contents: read
concurrency:
  group: mrc-crosswords-only
  cancel-in-progress: false
jobs:
  generate:
    # Automatic OFF unless MRC_DAILY_ENABLED is explicitly true; manual runs are independent.
    # No commit, push, published file update or Dropbox upload in this workflow.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.MRC_DAILY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Select Europe/Rome schedule slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || [ "$(TZ=Europe/Rome date +%H)" = 06 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Generate isolated preview
        if: steps.slot.outputs.run == 'true'
        env:
          INPUT_DATE: ${{ inputs.issue_date }}
          INPUT_CATEGORY: ${{ inputs.category }}
        shell: bash
        run: |
          DATE="${INPUT_DATE:-$(TZ=Europe/Rome date +%F)}"
          python3 scripts/build_daily_news_crossword.py --root . --date "$DATE" --category "${INPUT_CATEGORY:-news}" --budget-seconds 120 --output-dir /tmp/mrc-crossword/preview
      - name: Upload preview only
        if: steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crossword-preview
          path: /tmp/mrc-crossword/preview/*.json
          retention-days: 14
